<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DermaCare AI{% endblock %}</title>
    <meta name="description" content="{% block description %}AI-powered skin disease detection and monitoring platform.{% endblock %}">
    
    <!-- Shared Styles -->
    <link rel="stylesheet" href="/user/static/css/style.css">
    <link rel="stylesheet" href="/shared/static/css/header.css">
    <link rel="stylesheet" href="/shared/static/css/footer.css">
    <link rel="stylesheet" href="/shared/static/css/all.min.css">
    
    {% block extra_css %}{% endblock %}
</head>
<body style="background-color: #f1f5f9;">
    <!-- Reusable Header -->
    <div id="header-container"></div>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Reusable Footer -->
    <div id="footer"></div>

    <!-- Core Scripts -->
    <script src="/shared/static/js/dermacare-api.js"></script>
    <script src="/shared/static/js/header.js"></script>
    <script src="/shared/static/js/footer.js"></script>
    <script src="/user/static/js/main.js"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
