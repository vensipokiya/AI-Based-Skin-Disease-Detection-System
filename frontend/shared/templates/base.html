<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DermaCare AI{% endblock %}</title>
    <meta name="description" content="{% block description %}AI-powered skin disease detection system providing instant risk assessment and medical guidance.{% endblock %}">
    
    <!-- Security Headers (SonarCloud Hotspot Fix) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://appleid.cdn-apple.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://ui-avatars.com https://developers.google.com https://upload.wikimedia.org https://tile.openstreetmap.org https://*.tile.openstreetmap.org https://tile.openstreetmap.fr https://*.tile.openstreetmap.fr; connect-src 'self' https://nominatim.openstreetmap.org https://ipapi.co;">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="/static/user/css/style.css">
    <link rel="stylesheet" href="/shared/static/css/header.css">
    <link rel="stylesheet" href="/shared/static/css/footer.css">
    <link rel="stylesheet" href="/shared/static/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    {% block extra_css %}{% endblock %}
</head>
<body>

    <!-- Header -->
    <div id="header-container"></div>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <div id="footer"></div>

    <!-- Core Scripts -->
    <script src="/shared/static/js/dermacare-api.js"></script>
    <script src="/shared/static/js/dermacare-utils.js"></script>
    <script src="/shared/static/js/header.js"></script>
    <script src="/shared/static/js/footer.js"></script>
    
    {% block extra_js %}{% endblock %}

</body>
</html>
