<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Internal Server Error</title>
    <link rel="stylesheet" href="/static/user/css/style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; height: 100vh; text-align: center; background: #fff5f5; font-family: 'Inter', sans-serif; }
        .error-container { max-width: 500px; padding: 2rem; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }

        p { color: #64748b; font-size: 1.2rem; margin-bottom: 2rem; }
        .btn { display: inline-block; padding: 0.75rem 2rem; background: #e53e3e; color: white; text-decoration: none; border-radius: 10px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="error-container">
        <h1>500</h1>
        <p>Something went wrong on our end. We're working on it!</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
