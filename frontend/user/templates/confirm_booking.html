<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Your Appointment - DermaCare AI</title>
    <link rel="stylesheet" href="/user/static/css/style.css">
    <link rel="stylesheet" href="/shared/static/css/header.css">
    <link rel="stylesheet" href="/shared/static/css/footer.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/shared/static/css/all.min.css">
</head>

<body style="background-color: #f1f5f9;">

    <!-- Header -->
    <div id="header-container"></div>


    <!-- Booking & Confirmation Container -->
    <div class="container fade-in" style="padding: 4rem 1rem;">
        <div class="result-card" style="max-width: 500px; position: relative; margin: 0 auto;">

            <!-- Booking Form Section -->
            <section id="booking-section">
                <button class="btn btn-secondary mb-6" onclick="cancelBookingConfirmation()"
                    style="padding: 0.4rem 0.8rem; font-size: 0.9rem;">&larr; Back to Details</button>
                <br>
                <br>
                <div class="logo-container" style="margin-bottom: 2rem;">
                    <div
                        style="width: 70px; height: 70px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);">
                        <i class="fas fa-calendar-alt text-gradient"
                            style="font-size: 2rem; color: white !important; background: none; -webkit-text-fill-color: white;"></i>
                    </div>
                    <h2>Schedule Appointment</h2>
                    <p style="color: var(--text-light);">Select a date and time to book your visit.</p>
                </div>

                <form id="booking-form" onsubmit="submitBooking(event)" style="text-align: left;">
                    <div
                        style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 1rem; border-radius: var(--border-radius-md); margin-bottom: 1.5rem; text-align: center;">
                        <p
                            style="font-size: 0.85rem; color: var(--text-light); margin-bottom: 0.2rem; text-transform: uppercase; font-weight: bold; letter-spacing: 1px;">
                            Booking With</p>
                        <h4 id="booking-doctor-name" style="color: var(--primary-color); font-size: 1.2rem; margin: 0;">
                            Selected Doctor</h4>
                    </div>

                    <div class="mb-4">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;"><i
                                class="fas fa-calendar-day" style="color: var(--primary-color); width: 20px;"></i>
                            Select
                            Date</label>
                        <input type="date" id="booking-date" required
                            style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.5rem; font-size: 1.05rem; font-family: inherit; transition: border-color 0.2s ease; outline: none;"
                            onfocus="this.style.borderColor='var(--primary-color)'"
                            onblur="this.style.borderColor='#e2e8f0'">
                    </div>
                    <div class="mb-6">
                        <label style="display: block; margin-bottom: 0.5rem; font-weight: 500;"><i class="fas fa-clock"
                                style="color: var(--primary-color); width: 20px;"></i> Select Time</label>
                        <input type="time" id="booking-time" required
                            style="width: 100%; padding: 0.85rem; border: 2px solid #e2e8f0; border-radius: 0.5rem; font-size: 1.05rem; font-family: inherit; transition: border-color 0.2s ease; outline: none;"
                            onfocus="this.style.borderColor='var(--primary-color)'"
                            onblur="this.style.borderColor='#e2e8f0'">
                    </div>
                    <br>
                    <button type="submit" class="btn btn-primary w-full btn-lg"
                        style="font-size: 1.1rem; padding: 0.85rem;">
                        <i class="fas fa-check-circle"></i> Confirm Appointment
                    </button>
                </form>
            </section>
        </div>
    </div>

    <!-- JS functionality -->
    <script src="/shared/static/js/dermacare-api.js"></script>
    <script src="/user/static/js/main.js"></script>
    <script src="/user/static/js/booking.js"></script>
    <div id="footer"></div>
    <script src="/shared/static/js/footer.js"></script>
    <script src="/shared/static/js/header.js"></script>

</body>

</html>
