<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Specialists - DermaCare AI</title>
    <link rel="stylesheet" href="../../user/static/css/style.css"><link rel="stylesheet" href="../../shared/static/css/header.css">
    <link rel="stylesheet" href="../../shared/static/css/footer.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../shared/static/css/all.min.css">

    <!-- Leaflet.js for Nearby Dermatologist (Free - No API Key Needed) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body style="background-color: #f1f5f9;">

    <!-- Header -->
    <!-- Reusable Header -->
    <div id="header-container"></div>

    <!-- Nearby Dermatologists -->
    <style>
        body {
            overflow: hidden;
            /* Prevent body scroll on desktop for true app feel */
        }

        .horizontal-layout {
            display: grid;
            grid-template-columns: 450px 1fr;
            height: calc(100vh - 72px);
            /* Account for header height */
            background: var(--white);
            width: 100%;
        }

        .left-panel-doctors {
            height: 100%;
            overflow-y: auto;
            padding: 2rem;
            border-right: 1px solid #e2e8f0;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.05);
            z-index: 10;
        }

        /* Custom scrollbar for left panel */
        .left-panel-doctors::-webkit-scrollbar {
            width: 6px;
        }

        .left-panel-doctors::-webkit-scrollbar-track {
            background: transparent;
        }

        .left-panel-doctors::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .right-panel-map {
            height: 100%;
            position: relative;
            background: #f8fafc;
        }

        /* Hide footer to maintain full-screen interface */
        #footer {
            display: none !important;
        }

        @media (max-width: 900px) {
            body {
                overflow: auto;
            }

            .horizontal-layout {
                grid-template-columns: 1fr;
                height: auto;
            }

            .left-panel-doctors {
                height: 50vh;
                border-right: none;
                box-shadow: none;
                padding: 1.5rem;
            }

            .right-panel-map {
                height: 50vh;
            }

            #footer {
                display: block !important;
            }
        }
    </style>

    <section id="nearby-dermatologists" class="fade-in" style="padding: 0; margin: 0; max-width: 100%;">
        <div class="horizontal-layout">
            <!-- Left Panel: Doctors List -->
            <div class="left-panel-doctors">
                <div
                    style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 1rem; margin-bottom: 1.5rem;">
                    <h2 style="font-size: 1.5rem; margin: 0;">Nearby <span class="text-gradient">Specialists</span></h2>
                    <button class="btn btn-secondary" style="padding: 0.4rem 1rem; font-size: 0.85rem;"
                        onclick="window.location.href='/detect'">&larr; Back</button>
                </div>

                <div id="loading-doctors" style="text-align: center; padding: 2rem; display: none;">
                    <i class="fas fa-spinner fa-spin fa-2x text-gradient"></i>
                    <p class="mt-2" style="color: var(--text-muted);">Detecting your location & searching nearby
                        dermatologists...</p>
                </div>

                <div class="nearby-list" id="dermatologist-list"
                    style="display: flex; flex-direction: column; gap: 1rem;">
                    <!-- Additional results loaded dynamically -->
                </div>
            </div>

            <!-- Right Panel: Google Map -->
            <div class="right-panel-map">
                <!-- Google Maps Action Bar floating bottom over map -->
                <div id="google-maps-bar"
                    style="display: none; position: absolute; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 1000; width: 90%; max-width: 450px; padding: 0.8rem 1.25rem; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border-radius: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.12);">
                    <div
                        style="display: flex; align-items: center; justify-content: space-between; gap: 1rem;">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Google_Maps_icon_%282020%29.svg/1200px-Google_Maps_icon_%282020%29.svg.png"
                                alt="Google Maps" style="width: 28px; height: 28px;">
                            <div>
                                <p style="color: #334155; font-weight: 700; font-size: 0.9rem; margin: 0;">Open in Maps</p>
                            </div>
                        </div>
                        <a id="google-maps-link" href="#" target="_blank" class="btn"
                            style="background: #2563eb; color: white; font-weight: 700; padding: 0.5rem 1rem; border-radius: 12px; text-decoration: none; font-size: 0.85rem; transition: all 0.2s ease;">
                            View Full Map
                        </a>
                    </div>
                </div>

                <div id="map-container" style="width: 100%; height: 100%; display: none;">
                    <div id="map" style="width: 100%; height: 100%; background-color: #f1f5f9;"></div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div>
    <script src="../../shared/static/js/footer.js"></script>
    <script src="../../user/static/js/main.js"></script>
    <script>
        // Trigger map load automatically on this page
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof loadGoogleMapsNearby === 'function') {
                loadGoogleMapsNearby();
            }
        });
    </script>
    <script src="../../shared/static/js/header.js"></script>
</body>

</html>
