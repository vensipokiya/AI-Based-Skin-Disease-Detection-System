<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nearby Specialists - DermaCare AI</title>
    <link rel="stylesheet" href="/user/static/css/style.css">
    <link rel="stylesheet" href="/shared/static/css/header.css">
    <link rel="stylesheet" href="/shared/static/css/footer.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/shared/static/css/all.min.css">
    <link rel="stylesheet" href="/user/static/css/nearby_dermatologist.css">

    <!-- Leaflet.js -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>

<body style="background-color: #f1f5f9;">

    <!-- Header -->
    <div id="header-container"></div>

    <section id="nearby-dermatologists" class="fade-in" style="padding: 0; margin: 0; max-width: 100%;">
        <div class="horizontal-layout">
            <!-- Left Panel: Doctors List -->
            <div class="left-panel-doctors">
                <div
                    style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 1rem; margin-bottom: 1.5rem;">
                    <h2 style="font-size: 1.5rem; margin: 0;">Nearby <span class="text-gradient">Specialists</span></h2>
                    <button class="btn btn-secondary" style="padding: 0.4rem 1rem; font-size: 0.85rem;"
                        onclick="window.location.href='/detect'">&larr; Back</button>
                </div>

                <div id="loading-doctors" style="text-align: center; padding: 2rem; display: none;">
                    <i class="fas fa-spinner fa-spin fa-2x text-gradient"></i>
                    <p class="mt-2" style="color: var(--text-muted);">Detecting your location & searching nearby
                        dermatologists...</p>
                </div>

                <div class="nearby-list" id="dermatologist-list"
                    style="display: flex; flex-direction: column; gap: 1rem;">
                    <!-- Additional results loaded dynamically -->
                </div>
            </div>

            <!-- Right Panel: Google Map -->
            <div class="right-panel-map">
                <!-- Google Maps Action Bar floating over map -->
                <div id="google-maps-bar"
                    style="display: none; position: absolute; top: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 1000; width: 90%; max-width: 600px; padding: 1rem 1.5rem; background: linear-gradient(135deg, #1a73e8, #4285f4); border-radius: var(--border-radius-lg); box-shadow: 0 4px 15px rgba(26,115,232,0.3);">
                    <div
                        style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/aa/Google_Maps_icon_%282020%29.svg/1200px-Google_Maps_icon_%282020%29.svg.png"
                                alt="Google Maps" style="width: 32px; height: 32px;">
                            <div>
                                <p style="color: white; font-weight: 600; font-size: 1rem; margin: 0;">Open in Google
                                    Maps App</p>
                            </div>
                        </div>
                        <a id="google-maps-link" href="#" target="_blank" class="btn"
                            style="background: white; color: #1a73e8; font-weight: 700; padding: 0.5rem 1.2rem; border-radius: var(--border-radius-full); text-decoration: none; box-shadow: 0 2px 6px rgba(0,0,0,0.1); transition: all 0.2s ease;"
                            onmouseover="this.style.transform='scale(1.05)'"
                            onmouseout="this.style.transform='scale(1)'">
                            <i class="fas fa-external-link-alt" style="margin-right: 0.4rem;"></i> Open Maps
                        </a>
                    </div>
                </div>

                <div id="map-container" style="width: 100%; height: 100%; display: none;">
                    <div id="map" style="width: 100%; height: 100%; background-color: #f1f5f9;"></div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer"></div>
    <script src="/shared/static/js/footer.js"></script>
    <script src="/user/static/js/main.js"></script>
    <script src="/user/static/js/nearby_dermatologist.js"></script>
    <script src="/shared/static/js/header.js"></script>
</body>

</html>
