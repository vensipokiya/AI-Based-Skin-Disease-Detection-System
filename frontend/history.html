<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan History - DermaCare AI</title>
    <meta name="description" content="View your past AI skin disease scan results and track your skin health journey.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/footer.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body style="background-color: #f1f5f9;">

    <!-- Header -->
    <!-- Reusable Header -->
    <div id="header-container"></div>

    <!-- History Page -->
    <section id="history-page" class="fade-in">
        <div class="container" style="max-width: 1400px; margin:auto;">

            <div class="history-header"
                style="margin-bottom: 1.5rem; display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2 style="font-size: 2rem; font-weight: 800; color: #0f172a; margin-bottom: 0.5rem;">Scan <span
                            class="text-gradient">History</span></h2>
                    <p style="color: #64748b; font-size: 0.95rem;">Track your past skin analyses and monitor your skin
                        health over time.</p>
                </div>
                <div class="history-actions">
                    <a href="detection.html" class="btn btn-primary"
                        style="padding: 0.8rem 1.5rem; border-radius: 30px; font-weight: 600; box-shadow: 0 4px 12px rgba(59,130,246,0.3);">
                        <i class="fas fa-plus" style="margin-right: 0.5rem;"></i> New Scan
                    </a>
                </div>
            </div>

            <!-- Dashboard Split View -->
            <div class="split-container">
                <!-- Left Pane: Stats & List -->
                <div class="pane-left">
                    <!-- Stats Overview -->
                    <div class="history-stats" style="grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
                        <div class="stat-card compact-card">
                            <div class="stat-icon bg-blue" style="width: 40px; height: 40px; font-size: 0.9rem;">
                                <i class="fas fa-microscope"></i>
                            </div>
                            <div class="stat-info">
                                <span class="stat-number" id="stat-total" style="font-size: 1.2rem;">0</span>
                                <span class="stat-label" style="font-size: 0.7rem;">Scans</span>
                            </div>
                        </div>
                        <div class="stat-card compact-card">
                            <div class="stat-icon bg-purple" style="width: 40px; height: 40px; font-size: 0.9rem;">
                                <i class="fas fa-chart-line"></i>
                            </div>
                            <div class="stat-info">
                                <span class="stat-number" id="stat-avg-confidence" style="font-size: 1.2rem;">0%</span>
                                <span class="stat-label" style="font-size: 0.7rem;">Avg. Acc</span>
                            </div>
                        </div>
                    </div>

                    <!-- History List -->
                    <div id="history-list" class="history-list">
                        <!-- Dynamically populated -->
                    </div>

                    <!-- Empty State -->
                    <div id="empty-state" class="empty-state hidden">
                        <div class="empty-state-content">
                            <i class="fas fa-clock-rotate-left"></i>
                            <h3>No History Yet</h3>
                            <p style="font-size: 0.9rem;">Start your first scan to track your skin health.</p>
                        </div>
                    </div>
                </div>

                <!-- Right Pane: Details View -->
                <div class="pane-right" id="detail-pane">
                    <div class="empty-detail-state">
                        <i class="fas fa-file-medical"></i>
                        <h3>Select a Record</h3>
                        <p>Click on any scan from the list to view detailed analysis and recommendations.</p>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <script src="js/config.js"></script>
    <script src="js/header.js"></script>
    <script src="js/history.js"></script>
    <div id="footer"></div>
    <script src="js/footer.js"></script>
</body>

</html>


</html>
