# SonarCloud — match your project (override via CI env vars if needed)
sonar.organization=vensipokiya
sonar.projectKey=vensipokiya_AI-Based-Skin-Disease-Detection-System

# Only analyze the FastAPI app + frontend (excludes duplicate legacy backend/*, one-off scripts, model binaries)
sonar.sources=backend/app,frontend
sonar.sourceEncoding=UTF-8

sonar.python.version=3.11

# Binary / cache / vendor noise (within sources)
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/uploads/**,**/*.min.js,**/*.min.css,**/webfonts/**

# Copy/paste detector: similar HTML pages and repetitive JS inflate % duplicated lines without meaning much
sonar.cpd.exclusions=**/frontend/**/templates/**/*.html,**/frontend/**/*.js
